# Pings the live app so Render's free tier doesn't sleep (it sleeps after 15 idle minutes).
# Set a repository variable KHATA_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://khata.onrender.com. GitHub may delay scheduled runs, so also set up a
# cron-job.org ping (free) as described in the README.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    if: vars.KHATA_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.KHATA_URL }}/health"
