# Render Blueprint: free web service, no card needed.
# Deploy: Render dashboard > New > Blueprint > pick this repo. Fill the secrets it asks for.
# The free disk is wiped on every restart; the Google Sheet restore (khata/sheets.py) rebuilds
# the shopkeeper's ledger on boot. Demo accounts are disposable and re-seed on login.
services:
  - type: web
    name: khata
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: KHATA_DB
        value: /data/khata.db
      - key: KHATA_CLIENT_IP_HEADER
        value: x-forwarded-for
      - key: KHATA_BUDGET_CALLS
        value: "500"
      - key: KHATA_PUBLIC_URL
        sync: false            # e.g. https://khata.onrender.com
      - key: GROQ_API_KEY
        sync: false            # free key from console.groq.com; blank = demo mode
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: KHATA_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false            # paste the whole service-account key file contents
      - key: KHATA_SHEET_OWNER_NUMBER
        sync: false
