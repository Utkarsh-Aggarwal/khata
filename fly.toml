# Deploy: fly launch --no-deploy --copy-config && fly volumes create khata_data --size 1 && fly deploy
app = "khata-kiroween"
primary_region = "bom"

[build]

[env]
  KHATA_DB = "/data/khata.db"
  KHATA_CLIENT_IP_HEADER = "fly-client-ip"
  KHATA_BUDGET_CALLS = "500"

[mounts]
  source = "khata_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # keep the WhatsApp webhook and sheet mirror awake
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
